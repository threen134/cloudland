host: localhost:8256
info:
  contact: {}
  description: Path for symlink target (required for symlink operation)
  title: Alarm Rules Manager API
  version: "1.0"
paths:
  /activities:
    get:
      consumes:
      - application/json
      description: 当前组织在本区域的操作动态，按时间倒序、游标分页，组织内所有成员可见
      parameters:
      - description: default 20, max 100
        in: query
        name: limit
        type: integer
      - description: next_cursor from previous page
        in: query
        name: cursor
        type: string
      - description: RFC3339, inclusive; default 7 days before end
        in: query
        name: start
        type: string
      - description: RFC3339, exclusive; default now; range must not exceed 90 days
        in: query
        name: end
        type: string
      - description: resource type, such as instance
        in: query
        name: resource_type
        type: string
      - description: resource uuid
        in: query
        name: resource_uuid
        type: string
      - description: 'true: only succeeded, false: only failed'
        in: query
        name: success
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apis.ActivityListResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/common.APIError'
        "401":
          description: Not authorized
          schema:
            $ref: '#/definitions/common.APIError'
      summary: list activities of current organization
      tags:
      - Activity
  /addresses/{uuid}:
    get:
      consumes:
      - application/json
      description: list all IP addresses for a subnet identified by UUID
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apis.AddressListResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/common.APIError'
        "401":
          description: Not authorized
          schema:
            $ref: '#/definitions/common.APIError'
      summary: list IP addresses by subnet UUID
      tags:
      - Address
  /addresses/remark:
    patch:
      consumes:
      - application/json
      description: batch patch addresses with unified remark
      parameters:
      - description: Address patch payload
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/apis.AddressRemarkPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/apis.AddressResponse'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/common.APIError'
        "401":
          description: Not authorized
          schema:
            $ref: '#/definitions/common.APIError'
      summary: batch patch addresses
      tags:
      - Administration
      - Address Admin
  /addresses/update-lock:
    patch:
      consumes:
      - application/json
      description: batch lock or unlock addresses
      parameters:
      - description: batch lock or unlock payload
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/apis.AddressUpdateLockPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/apis.AddressResponse'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/common.APIError'
        "401":
          description: Not authorized
          schema:
            $ref: '#/definitions/common.APIError'
      summary: batch update address lock
      tags:
      - Administration
      - Address Admin
  /adjust/regenerate-bandwidth-metrics:
    post:
      consumes:
      - application/json
      description: Regenerate bandwidth configuration metrics for all active VMs or
        a specific hyper node
      parameters:
      - description: Specific hyper node ID
        in: query
        name: hyper_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Regeneration result
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Regenerate bandwidth config metrics
      tags:
      - Auto Scaling
  /alarm/events:
    get:
      consumes:
      - application/json
      description: List alarm events filtered by the current user's organization,
        supports pagination and status filter
      parameters:
      - description: Filter by status (firing, resolved)
        in: query
        name: status
        type: string
      - description: If 'true', only return firing event count
        in: query
        name: count_only
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Alarm events list
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: List alarm events
      tags:
      - Notification
  /alarm/events/{event_uuid}/delivery-logs:
    get:
      consumes:
      - application/json
      description: Get notification delivery logs for a specific alarm event (validates
        event ownership)
      parameters:
      - description: Alarm event UUID
        in: path
        name: event_uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Delivery logs
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Event not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get alarm delivery logs
      tags:
      - Notification
  /alarm/rule-channels:
    post:
      consumes:
      - application/json
      description: Bind one or more notification channels to an alarm rule group
      produces:
      - application/json
      responses:
        "200":
          description: Binding successful
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Channel not owned
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Channel not synced
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Bind notification channels to alarm rule
      tags:
      - Notification
  /alarm/rule-channels/{uuid}:
    get:
      consumes:
      - application/json
      description: Get the list of notification channels bound to a specific alarm
        rule group
      parameters:
      - description: Rule group UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Rule channel bindings
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Get notification channels bound to alarm rule
      tags:
      - Notification
  /alerts/process:
    post:
      consumes:
      - application/json
      description: Handle AlertManager callback with fingerprint-based idempotent
        event upsert and notification dispatch
      produces:
      - application/json
      responses:
        "200":
          description: Processed result
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid alert payload
          schema:
            additionalProperties: true
            type: object
      summary: Process AlertManager webhook
      tags:
      - Notification
  /alerts/resource-adjustment:
    post:
      consumes:
      - application/json
      description: Handle Prometheus AlertManager webhook for resource auto-adjustment
        (CPU/bandwidth scaling)
      produces:
      - application/json
      responses:
        "200":
          description: Processed
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Process resource adjustment webhook
      tags:
      - Auto Scaling
  /api/v1/rules:
    post:
      consumes:
      - application/json
      description: Register API routes for managing Prometheus rule files
      produces:
      - application/json
      responses: {}
      summary: Register rule management API routes
      tags:
      - rules
  /api/v1/rules/{operation}:
    post:
      consumes:
      - application/json
      description: Handle various operations on rule files (write, symlink, chown,
        reload, delete, read, check)
      parameters:
      - description: Rule file operation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.RuleFileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Operation successful
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Handle rule file operations
      tags:
      - rules
