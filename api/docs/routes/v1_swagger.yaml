      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apis.StoragePoolResponse'
      summary: get a storage pool
      tags:
      - StoragePool
    patch:
      consumes:
      - application/json
      description: 'quota_gb (shared pools only) is changed on its own: a task sets
        it on the storage cluster (202); with other fields in the same request it
        is refused before anything changes'
      parameters:
      - description: Storage pool UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: message
        required: true
