          description: Not authorized
          schema:
            $ref: '#/definitions/common.APIError'
      summary: list placement groups
      tags:
      - Placement Group
    post:
      consumes:
      - application/json
      description: create a placement group in a zone. spread keeps the members on
        different hosts, pack on one host; a strict group refuses what breaks its
        rule, a best-effort one relaxes it. An organization has at most 50 groups
      parameters:
      - description: Placement group create payload
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/apis.PlacementGroupPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apis.PlacementGroupResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/common.APIError'
        "401":
          description: Not authorized
          schema:
            $ref: '#/definitions/common.APIError'
        "409":
          description: Name taken (111702) or too many groups (111707)
          schema:
            $ref: '#/definitions/common.APIError'
      summary: create a placement group
      tags:
      - Placement Group
  /placement_groups/{id}:
    delete:
      consumes:
      - application/json
      description: delete an empty placement group (409 while it has members, being
        deleted ones included)
