  /storage_backends:
    get:
      description: the kinds CloudLand can deploy or import, with the roles, disk
        role, suggested roles and host requirements of each (shared-storage-design.md
        §4.5)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apis.StorageBackendListResponse'
      summary: list the kinds of storage clusters
      tags:
      - StorageCluster
  /storage_clusters:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apis.StorageClusterListResponse'
      summary: list storage clusters
      tags:
      - StorageCluster
    post:
      consumes:
      - application/json
      description: records the cluster with its hosts and disks and starts its deployment
        (shared-storage-design.md §7.2); follow the task in active_task. The disks
        are claimed at once
      parameters:
      - description: Cluster
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/apis.StorageClusterCreatePayload'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apis.StorageClusterResponse'
      summary: create a managed storage cluster
      tags:
      - StorageCluster
  /storage_clusters/{id}:
    delete:
      description: tears the storage software down, wipes the disks of the cluster
        and cleans every host, then removes the records (shared-storage-design.md
        §7.6). Refused while the cluster has storage pools or a task holds it
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      - description: 'The name of the cluster, typed to confirm: its disks are wiped'
        in: query
        name: confirm_name
        required: true
        type: string
      - description: Remove the storage software from the hosts too
        in: query
        name: purge_packages
        type: boolean
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apis.StorageTaskResponse'
      summary: delete a storage cluster
      tags:
      - StorageCluster
    get:
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apis.StorageClusterResponse'
      summary: get a storage cluster
      tags:
      - StorageCluster
    patch:
      consumes:
      - application/json
      description: 'the description, and the zones whose hosts join the cluster as
        clients on their own (shared-storage-design.md §6.3): every online host of
        those zones not in the cluster is queued and joins with a task of its own
        once the cluster is free; one that fails is left alone and listed until retry_auto_join.
        With auto_join_new_only only the hosts registered from then on join'
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      - description: Changes
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/apis.StorageClusterPatchPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apis.StorageClusterResponse'
      summary: change a storage cluster
      tags:
      - StorageCluster
  /storage_clusters/{id}/disks:
    post:
      consumes:
      - application/json
      description: 'disks of member hosts join the cluster: they become NSDs of its
        file system (shared-storage-design.md §7.5). Rebalancing is a separate task'
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      - description: Disks (nodes must be empty)
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/apis.StorageExpandPayload'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apis.StorageTaskResponse'
      summary: add disks to a storage cluster
      tags:
      - StorageCluster
  /storage_clusters/{id}/disks/{disk_id}:
    delete:
      description: the data of the disk moves to the other disks, then it is wiped
        and given back to its host (shared-storage-design.md §7.5). Refused when the
        cluster would have too few failure groups for its replicas
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      - description: Disk UUID (the id of a disk of the cluster)
        in: path
        name: disk_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apis.StorageTaskResponse'
      summary: remove a disk from a storage cluster
      tags:
      - StorageCluster
  /storage_clusters/{id}/disks/{disk_id}/replace:
    post:
      consumes:
      - application/json
      description: 'a disk the storage reports down is swapped for a new disk of the
        same host (shared-storage-design.md §7.5, §8.5): GPFS drops the failed NSD
        (mmdeldisk -p), adds the new one and restores the replication; Ceph destroys
        the OSD keeping its id and makes the new disk take it. The failed disk is
        not wiped. A disk that works is removed the normal way instead'
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      - description: UUID of the failed disk in the cluster
        in: path
        name: disk_id
        required: true
        type: string
      - description: The new disk
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/apis.StorageReplaceDiskPayload'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apis.StorageTaskResponse'
      summary: replace a failed disk of a storage cluster
      tags:
      - StorageCluster
  /storage_clusters/{id}/filesystems:
    post:
      consumes:
      - application/json
      description: 'a new file system on new disks of the members: NSDs made, the
        file system made and mounted on every member (shared-storage-design.md §7.3).
        Pools pick it by name (filesystem); system admins'
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      - description: The file system and its disks
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/apis.StorageFilesystemPayload'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apis.StorageTaskResponse'
      summary: make a file system on a storage cluster
      tags:
      - StorageCluster
  /storage_clusters/{id}/filesystems/{name}:
    delete:
      description: unmounts and deletes a file system no storage pool is on, with
        its NSDs; its disks are wiped and given back to their hosts. The only file
        system of a cluster goes with the cluster (shared-storage-design.md §7.3);
        system admins
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      - description: File system name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apis.StorageTaskResponse'
      summary: delete a file system of a storage cluster
      tags:
      - StorageCluster
  /storage_clusters/{id}/metrics:
    get:
      description: 'Curves of a storage cluster from Prometheus (shared-storage-design.md
        §14.3): the use of its pools, its capacity, throughput and IOPS, and its hosts
        (GPFS) or OSDs (Ceph). Only for system admins. A chart with no data at all
        is left out.'
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      - description: Start, unix seconds
        in: query
        name: start
        required: true
        type: string
      - description: End, unix seconds
        in: query
        name: end
        required: true
        type: string
      - description: Resolution as a duration, e.g. 60s or 5m
        in: query
        name: step
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apis.StorageMetricsResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/common.APIError'
        "401":
          description: Not authorized
          schema:
            $ref: '#/definitions/common.APIError'
      summary: storage cluster metrics
      tags:
      - StorageCluster
  /storage_clusters/{id}/nodes:
    post:
      consumes:
      - application/json
      description: 'hosts join a managed cluster with their disks, or none (shared-storage-design.md
        §7.5): prechecked, installed and added; their disks go into the file system.
        Rebalancing is a separate task'
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      - description: Hosts and their disks
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/apis.StorageExpandPayload'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apis.StorageTaskResponse'
      summary: add hosts to a storage cluster
      tags:
      - StorageCluster
  /storage_clusters/{id}/nodes/{hypervisor}:
    delete:
      description: 'the disks of the host leave first (their data moves to the other
        disks), then the host leaves and is cleaned. offline=true removes a host that
        is gone for good: nothing runs on it, its disks are dropped without moving
        their data; confirm must be its name (shared-storage-design.md §7.5)'
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      - description: Hypervisor UUID
        in: path
        name: hypervisor
        required: true
        type: string
      - description: The host is gone for good
        in: query
        name: offline
        type: boolean
      - description: The host name, for an offline removal
        in: query
        name: confirm
        type: string
      - description: Remove the storage software from the host too
        in: query
        name: purge_packages
        type: boolean
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apis.StorageTaskResponse'
      summary: remove a host from a storage cluster
      tags:
      - StorageCluster
    patch:
      consumes:
      - application/json
      description: GPFS quorum (with manager) and admin hosts, Ceph mon, mgr and admin
        placement (shared-storage-design.md §13.1), checked like a new cluster; the
        disk role follows the disks of the host
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      - description: Hypervisor UUID
        in: path
        name: hypervisor
        required: true
        type: string
      - description: Roles
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/apis.StorageChangeRolesPayload'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apis.StorageTaskResponse'
      summary: change the roles of a member of a storage cluster
      tags:
      - StorageCluster
  /storage_clusters/{id}/rebalance:
    post:
      consumes:
      - application/json
      description: 'spread the data over all disks (gpfs mmrestripefs -b): long and
        I/O heavy, best started at a quiet time'
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      - description: File system
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/apis.StorageRebalancePayload'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apis.StorageTaskResponse'
      summary: rebalance a file system of a storage cluster
      tags:
      - StorageCluster
  /storage_clusters/{id}/remote_mounts:
    get:
      description: the file systems of this cluster other clusters mount, and the
        file systems of others it mounts (shared-storage-design.md §7.11); system
        admins
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apis.StorageRemoteMountListResponse'
      summary: list the remote mounts of a storage cluster
      tags:
      - StorageCluster
    post:
      consumes:
      - application/json
      description: 'the hosts of another managed cluster of the kind mount a file
        system of this one under its name and mount point (GPFS multi-cluster: keys
        exchanged, the file system granted, mounted on every host there); the pools
        on it become usable on those hosts. A task of the cluster that mounts (shared-storage-design.md
        §7.11); system admins'
      parameters:
      - description: Cluster UUID (whose file system it is)
        in: path
        name: id
        required: true
        type: string
      - description: The file system and the cluster that mounts it
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/apis.StorageRemoteMountPayload'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apis.StorageTaskResponse'
      summary: let another storage cluster mount a file system
      tags:
      - StorageCluster
  /storage_clusters/{id}/remote_mounts/{mount_id}:
    delete:
      description: the hosts of the other cluster unmount the file system and its
        grant goes; refused while instances on those hosts use volumes of the pools
        on it (shared-storage-design.md §7.11); system admins
      parameters:
      - description: Cluster UUID (whose file system it is)
        in: path
        name: id
        required: true
        type: string
      - description: Remote mount UUID
        in: path
        name: mount_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apis.StorageTaskResponse'
      summary: stop another storage cluster mounting a file system
      tags:
      - StorageCluster
  /storage_clusters/{id}/rotate_keys:
    post:
      consumes:
      - application/json
      description: 'renew the SSH key of a managed cluster and, for Ceph, the key
        of its client user, without a moment when a host or QEMU is left without a
        valid key (shared-storage-design.md §6.6, §8.4). Every member must be online.
        Nothing named: both. The new client key becomes the key of the user the first
        time a host uses it, the old one is refused for new sessions from then on;
        running instances keep their sessions and take the new key when they start
        again or migrate'
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      - description: What to rotate
        in: body
        name: message
        schema:
          $ref: '#/definitions/apis.StorageRotateKeysPayload'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apis.StorageTaskResponse'
      summary: rotate the keys of a storage cluster
      tags:
      - StorageCluster
  /storage_clusters/{id}/upgrade:
    post:
      consumes:
      - application/json
      description: 'roll a managed cluster to a new release, one host after the other
        (shared-storage-design.md §7.7, §8.7). gpfs: name the package of the new release;
        each host has the instances that use the cluster moved off (as maintenance
        does), GPFS stopped, upgraded and started, and its disks brought back before
        the next one; then, separately, finalize to raise the cluster and its file
        systems to the release (irreversible). ceph: the hosts install the release
        their distribution has and cephadm upgrades the daemons; no instance moves
        (QEMU takes the new client library when it starts again or migrates). Every
        member must be online'
      parameters:
      - description: Cluster UUID
        in: path
        name: id
        required: true
        type: string
      - description: What to upgrade to
        in: body
        name: message
        schema:
          $ref: '#/definitions/apis.StorageUpgradePayload'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apis.StorageTaskResponse'
      summary: upgrade a storage cluster
      tags:
      - StorageCluster
  /storage_clusters/import:
    post:
      consumes:
      - application/json
      description: 'record a cluster its own admins run and that the given hosts are
        members of already (shared-storage-design.md §7.8): every host is checked,
        nothing of the cluster is changed. Pools are then registered on directories
        that exist (POST /storage_pools with the cluster and params.path)'
      parameters:
      - description: Cluster
        in: body
