      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Not authorized
          schema:
            $ref: '#/definitions/common.APIError'
        "409":
          description: The group has members (111703)
          schema:
            $ref: '#/definitions/common.APIError'
      summary: delete a placement group
      tags:
      - Placement Group
