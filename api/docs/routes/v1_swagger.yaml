  /storage_tasks/{id}/runs/{run}/log:
    get:
      description: The callback of a run only brings the last 64 KiB of its log. The
        first call asks the host for the whole log and answers 202; call again until
        the answer is 200 with the log (its last 16 MiB). A run that is still running
        is fetched again when the copy is older than 30 s.
      parameters:
      - description: Task UUID
        in: path
