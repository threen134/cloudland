  /hypers/{uuid}/evacuate:
    post:
      consumes:
      - application/json
      description: Recover the instances of a host that cland has had offline for
        at least 5 minutes on other hosts. Only instances whose disks are all in shared
        storage pools can be recovered; the others are listed as not_doing with the
        reason. The host is first fenced on every storage cluster their disks are
        on (GPFS expels it, Ceph blocklists its address), then each instance is defined
        again from its record on a host that reaches its pools and started when it
        was running. A host that can not be fenced (no other admin host online, an
        imported GPFS cluster) needs confirm_fenced. The copies left on the host are
        removed when it comes back, and the fences lifted after that.
      parameters:
      - description: Hypervisor UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Evacuation options
        in: body
        name: body
        schema:
          $ref: '#/definitions/apis.HyperEvacuatePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apis.HyperEvacuateResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/common.APIError'
        "404":
          description: Hypervisor not found
          schema:
            $ref: '#/definitions/common.APIError'
        "409":
          description: The host is not offline long enough, or can not be fenced
          schema:
            $ref: '#/definitions/common.APIError'
      summary: evacuate a hypervisor that is down
      tags:
      - Administration
      - Hypervisor
