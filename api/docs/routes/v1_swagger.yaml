info:
  contact: {}
  description: APIs for CloudLand Functions
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: CloudLand API
  version: "1.0"
paths:
  /addresses/{uuid}:
    get:
      consumes:
      - application/json
      description: list all IP addresses for a subnet identified by UUID
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apis.AddressListResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/common.APIError'
        "401":
          description: Not authorized
          schema:
            $ref: '#/definitions/common.APIError'
      summary: list IP addresses by subnet UUID
      tags:
      - Address
  /addresses/remark:
    patch:
      consumes:
      - application/json
      description: batch patch addresses with unified remark
      parameters:
      - description: Address patch payload
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/apis.AddressRemarkPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/apis.AddressResponse'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/common.APIError'
        "401":
          description: Not authorized
          schema:
            $ref: '#/definitions/common.APIError'
      summary: batch patch addresses
      tags:
      - Administration
      - Address Admin
  /addresses/update-lock:
    patch:
      consumes:
      - application/json
      description: batch lock or unlock addresses
      parameters:
      - description: batch lock or unlock payload
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/apis.AddressUpdateLockPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/apis.AddressResponse'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/common.APIError'
        "401":
          description: Not authorized
          schema:
            $ref: '#/definitions/common.APIError'
      summary: batch update address lock
      tags:
      - Administration
      - Address Admin
  /alarm/events:
    get:
      consumes:
      - application/json
      description: List alarm events filtered by the current user's organization,
        supports pagination and status filter
      parameters:
      - description: Filter by status (firing, resolved)
        in: query
        name: status
        type: string
      - description: If 'true', only return firing event count
        in: query
        name: count_only
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Alarm events list
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
