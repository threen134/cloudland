name: 'Check Branch'

on:
  pull_request:

jobs:
  check_branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch
        if: github.base_ref == 'main' && (github.head_ref != 'staging' || github.head_ref != 'hotfix')
        run: |
          echo "ERROR: You can only merge to main from staging."
          exit 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # 文案键校验：三个语言包必须对齐，代码用到的键必须存在。
      # vue-i18n 找不到键时会把键名当文案显示出来，不校验就只能靠肉眼发现
      - run: npm run i18n:check
      - run: npm run lint
      - run: npm run build

  # Every external route (cpgateway's own routes plus the proxy whitelist) needs a regression test
  # case: fails on a new route without one, and on a known gap that got a case but is still in the
  # baseline. See docs/architecture/design-code-test-alignment.md §3.4
  route-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python test-items/scripts/check_route_coverage.py
