# CloudLand Nginx SSL 反向代理配置 (Docker 版)
# 场景一 (full profile): Vue.js UI + Control Plane Gateway + CloudLand 区域控制面
# 关键改动:
# - / 服务 Vue.js 静态文件 (打包在 nginx 镜像中)
# - /api/v1/ 代理到 cpgateway (cpgateway 内部代理 clapi)
# - 移除直接代理 clbase/clapi 的配置

server {
    listen 443 http2 ssl;
    listen [::]:443 http2 ssl;

    server_name _;

    ssl_certificate /certs/nginx/selfsigned.crt;
    ssl_certificate_key /certs/nginx/selfsigned.key;
    ssl_dhparam /certs/nginx/dhparam.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_ecdh_curve secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Vue.js SPA — nginx 直接服务静态文件
    root /usr/share/cloudland-ui;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # 所有 API 请求（含 /api/v1/docs Swagger UI） → cpgateway (cpgateway 内部代理到 clapi)
    location /api/v1/ {
        proxy_pass http://cpgateway:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        client_max_body_size 10m;
        proxy_read_timeout 60s;
    }

    # VitePress Documentation
    location /docs/ {
        proxy_pass http://docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # VNC Console WebSocket 代理
    location /websockify {
        proxy_pass https://consoleproxy:9443;
        proxy_set_header Host $host:$server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
