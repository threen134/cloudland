# CloudLand Nginx SSL 反向代理配置 (Docker 版)
# 基于 deploy/roles/nginx/templates/ssl.conf.j2
# 关键改动: proxy_pass 从 127.0.0.1 改为 Docker Compose 服务名

server {
    listen 443 http2 ssl;
    listen [::]:443 http2 ssl;

    server_name _;

    ssl_certificate /certs/nginx/selfsigned.crt;
    ssl_certificate_key /certs/nginx/selfsigned.key;
    ssl_dhparam /certs/nginx/dhparam.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_ecdh_curve secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # clbase - Web 管理界面
    location / {
        proxy_pass_header Authorization;
        proxy_pass https://clbase:5443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_redirect off;
    }

    # clapi - Swagger 文档
    location /swagger/api/v1 {
        proxy_pass https://clapi:8255;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_redirect off;
    }

    # clapi - REST API
    location /api/v1 {
        proxy_pass_header Authorization;
        proxy_pass_header X-Resource-User;
        proxy_pass_header X-Resource-Org;
        proxy_pass https://clapi:8255;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_redirect off;
    }

    # VNC Console WebSocket 代理
    location /websockify {
        proxy_pass https://consoleproxy:9443;
        proxy_set_header Host $host:$server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_redirect off;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
