# CloudLand Nginx 主配置 (Docker 版)
# 基于 deploy/roles/nginx/templates/nginx.conf.j2

worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# 链路追踪：官方 -otel 镜像自带 ngx_otel_module
load_module modules/ngx_otel_module.so;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" trace_id=$otel_trace_id';

    access_log  /var/log/nginx/access.log  main;

    # 链路追踪：span 导出到 OTel Collector；具体 location 通过 otel_trace 开启
    otel_exporter {
        endpoint otel-collector:4317;
    }
    otel_service_name cloudland-nginx;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # 加载额外配置
    include /etc/nginx/conf.d/*.conf;

    # 镜像文件服务 (端口 4000)
    server {
        listen       4000 default_server;
        listen       [::]:4000 default_server;
        server_name  _;
        root         /opt/cloudland/cache/image;

        location / {
        }

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }

}
