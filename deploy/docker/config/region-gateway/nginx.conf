# CloudLand Region Gateway Nginx 配置
# 轻量级边缘代理，仅负责 /websockify 的 TLS 终端和 WebSocket 转发
# 用于多 Region 部署中远程 Region 节点 (COMPOSE_PROFILES=region,region-gateway)

worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        server_name _;

        ssl_certificate     /certs/region-gw/selfsigned.crt;
        ssl_certificate_key /certs/region-gw/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # VNC Console WebSocket 代理到内部 consoleproxy
        location /websockify {
            proxy_pass https://consoleproxy:9443;
            proxy_http_version 1.1;
            proxy_set_header Host $host:$server_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            client_max_body_size 0;
            proxy_read_timeout 3600s;
        }

        # 健康检查端点
        location /healthz {
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
