# Grafana Tempo 单体模式配置（链路追踪后端）
# 启动参数 -config.expand-env=true：${VAR:-默认值} 可由环境变量覆盖
# OTLP 接收：4317 (gRPC) / 4318 (HTTP)，由 OTel Collector 转发；查询 API：3200（Grafana 数据源）

# Grafana 通过 gRPC 流式查询（TraceQL 搜索）复用 HTTP 端口
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317 # 显式绑定，新版本默认只监听 localhost
        http:
          endpoint: 0.0.0.0:4318

compactor:
  compaction:
    block_retention: ${TEMPO_RETENTION:-168h} # 链路保留时间，默认 7 天

storage:
  trace:
    # local：本机磁盘；s3：S3 兼容对象存储（HA 下两台控制节点共享，故障切换后仍可查询历史链路）
    backend: ${TEMPO_STORAGE_BACKEND:-local}
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    s3:
      endpoint: ${TEMPO_S3_ENDPOINT:-}
      bucket: ${TEMPO_S3_BUCKET:-tempo}
      access_key: ${TEMPO_S3_ACCESS_KEY:-}
      secret_key: ${TEMPO_S3_SECRET_KEY:-}
      insecure: ${TEMPO_S3_INSECURE:-true}
      forcepathstyle: true

usage_report:
  reporting_enabled: false
