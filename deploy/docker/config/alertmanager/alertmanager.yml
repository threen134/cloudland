global:
  resolve_timeout: 5m
route:
  group_by: ["alertname", "rule_group"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "clapi-webhook"
receivers:
- name: "clapi-webhook"
  webhook_configs:
  - url: "https://clapi:8255/api/v1/alerts/process"
    send_resolved: true
    http_config:
      tls_config:
        insecure_skip_verify: true
