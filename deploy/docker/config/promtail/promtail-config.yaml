server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: cloudland-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_name"]
        regex: "/cloudland-.+"
        action: keep
    # 增加 pipeline_stages 来自动解析 JSON 日志
    pipeline_stages:
      - docker: {} # 解析 Docker 的原生日志包装 (log, stream, time)
      - json:
          expressions:
            tag: tag
            status: status
            latency_ms: latency_ms
            method: method
            request_id: request_id
      - labels:
          tag:
          status:
          method:
