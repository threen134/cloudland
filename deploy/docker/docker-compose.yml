# =============================================================================
# CloudLand 控制面 Docker Compose 编排文件
#
# 使用方法:
#   1. cp .env.example .env && 编辑 .env
#   2. bash scripts/init-certs.sh
#   3. mkdir -p ../dns/hosts ../dns/conf.d && touch ../dns/hosts/hyper-hosts && echo "server=8.8.8.8" > ../dns/conf.d/upstream.conf
#   4. docker compose up -d --build
#
# Profile 说明:
#   region         - 区域控制面服务 (cloudland, clapi, consoleproxy, 监控栈)
#   region-gateway - Region 边缘网关 (VNC WebSocket TLS 终端，多 Region 远程节点使用)
#   full           - 中央控制面 (nginx + cpgateway)
#   dev            - 本地容器化 PostgreSQL
#   minio          - 内置 MinIO 镜像仓库 (不加则使用外部 S3，MinIO 容器不启动)
#
# 常用组合:
#   COMPOSE_PROFILES=full,dev,region          → 全量单节点 (推荐)
#   COMPOSE_PROFILES=full,dev,region,minio    → 全量 + 内置 MinIO (私有化部署)
#   COMPOSE_PROFILES=full,dev                 → 仅中央控制面 + 本地 DB (多 Region 中央节点)
#   COMPOSE_PROFILES=full,region              → 全量 + 外部 DB (HA 部署)
#   COMPOSE_PROFILES=region,region-gateway    → 远程 Region 节点 (含 VNC 边缘网关)
#   COMPOSE_PROFILES=region                   → 仅区域控制面 (远程 Region 节点，无 VNC 边缘网关)
#   COMPOSE_PROFILES=dev,region               → 区域控制面 + 本地 DB + cpgateway
#
# 服务清单:
#   postgres        - PostgreSQL 数据库 (profile: dev)
#   cloudland       - 主控服务 cland-go (gRPC :5006，计算节点接入) (profile: region)
#   clapi           - REST API (统一 API 服务) (profile: region)
#   consoleproxy    - VNC 控制台代理 (profile: region)
#   cpgateway       - 控制平面网关 (认证/代理/Region管理) (profile: dev, full)
#   nginx           - 反向代理 / SSL 终端 / Vue.js UI (profile: full)
#   prometheus      - 监控指标采集 (profile: region)
#   alertmanager    - 告警管理 (profile: region)
#   grafana         - 监控仪表盘 (profile: region)
#   loki            - 日志聚合 (profile: region)
#   promtail        - 日志采集 (profile: region)
#   otel-collector  - 链路数据接收、RED 指标与尾部采样 (profile: region, full)
#   tempo           - 链路追踪存储 (profile: region, full)
#   alarm-rules-mgr - 告警规则管理 (profile: region)
#   region-gateway  - Region VNC WebSocket 边缘网关 (profile: region-gateway)
# =============================================================================

services:
  # ---------- 数据库 ----------
  # dev 模式 (COMPOSE_PROFILES=dev) 启动本地 postgres；生产/HA 模式连接外部 DB
  postgres:
    image: postgres:14
    container_name: cloudland-postgres
    restart: unless-stopped
    profiles:
      - dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-d6Passwd}
      POSTGRES_DB: ${POSTGRES_DB:-cloudland}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${DB_LISTEN_IP:-127.0.0.1}:5432:5432"
    networks:
      cloudland:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- dnsmasq (内部 DNS) ----------
  dnsmasq:
    image: drpsychick/dnsmasq:2.89
    container_name: cloudland-dnsmasq
    restart: unless-stopped
    profiles:
      - region
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ../dns/hosts:/etc/dnsmasq.hosts:ro   # hosts 专用目录，inotify 监听
      - ../dns/conf.d:/etc/dnsmasq.conf.d:ro # upstream.conf 由 clapi 写入
    # --conf-file=/dev/null：不加载镜像自带配置；上游用 --servers-file 加载，SIGHUP 时重读
    # （conf-dir 里的 server= 只在启动时读取）。clapi 通过 docker exec kill -HUP 1 重载，
    # 不能用 docker kill -s HUP：会把容器标记为手动停止，unless-stopped 在重启后不再拉起
    command: >
      --keep-in-foreground
      --conf-file=/dev/null
      --no-resolv
      --no-hosts
      --hostsdir=/etc/dnsmasq.hosts
      --servers-file=/etc/dnsmasq.conf.d/upstream.conf
      --listen-address=${INTERNAL_IP:-127.0.0.1}
      --bind-interfaces
      --port=53
      --log-queries
    # 进程存活即代表 53 端口已绑定 (--keep-in-foreground 模式下绑定失败会立即退出)
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x dnsmasq >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ---------- CloudLand 主控 (Go gRPC) ----------
  cloudland:
    build:
      context: ../../
      dockerfile: deploy/docker/dockerfiles/Dockerfile.cland-go
    image: cloudland-cland-go:latest
    container_name: cloudland-cland
    restart: unless-stopped
    profiles:
      - region
    # 使用 host 网络以便与计算节点 gRPC 通信
    network_mode: host
    dns:
      - ${INTERNAL_IP:-127.0.0.1}
    environment:
      # 同一端口服务 clapi 与计算节点 cloudlet；计算节点经 MANAGEMENT_VIP 连入（HA 下 VIP 会漂移），
      # 因此默认监听全部地址；未配置 GRPC_AUTH_TOKEN 时 cland-go 拒绝启动。
      # 部署脚本未对 5006 做来源限制（loki 3100、otel-collector 4317 同），依赖令牌鉴权 + 内网隔离
      GRPC_LISTEN: "${GRPC_LISTEN:-0.0.0.0:5006}"
      GRPC_AUTH_TOKEN: ${GRPC_AUTH_TOKEN:-}
      GRPC_AUTH_DISABLED: ${GRPC_AUTH_DISABLED:-}
      CLAPI_ENDPOINT: "http://${INTERNAL_IP:-127.0.0.1}:5005"
      CLOUDLAND_SSH_KEY_DIR: /opt/cloudland/deploy/.ssh
      # 链路追踪：host 网络下经 INTERNAL_IP 访问 OTel Collector 的 OTLP 端口
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://${INTERNAL_IP:-127.0.0.1}:4317"
      TRACING_SAMPLE_RATIO: ${TRACING_SAMPLE_RATIO:-1}
      TRACING_BACKGROUND_SAMPLE_RATIO: ${TRACING_BACKGROUND_SAMPLE_RATIO:-0.01}
    volumes:
      - ../.ssh:/opt/cloudland/deploy/.ssh:ro
      - cland_log:/opt/cloudland/log
      - cland_cache:/opt/cloudland/cache
    depends_on:
      dnsmasq:
        condition: service_healthy


  # ---------- clapi (REST API) ----------
  clapi:
    build:
      context: ../../
      dockerfile: deploy/docker/dockerfiles/Dockerfile.web
      target: clapi
    image: cloudland-clapi:latest
    container_name: cloudland-clapi
    restart: unless-stopped
    profiles:
      - region
    # 指向宿主 dnsmasq（hyper-hosts 里有 images.cloudland.internal / clapi.cloudland.internal）
    # 否则 clapi 自己 InitS3 时解析 S3_ENDPOINT 会走 Docker embedded resolver 落空
    dns:
      - ${INTERNAL_IP:-127.0.0.1}
    environment:
      # 用于生成发往前端的 VNC Console 代理地址，不控制本容器物理监听 IP
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      MANAGEMENT_VIP: ${MANAGEMENT_VIP:-127.0.0.1}
      # Address of this host: compute nodes allow serial console connections from it, since the console
      # proxy on this host connects from here (in an HA control plane that is not MANAGEMENT_VIP)
      INTERNAL_IP: ${INTERNAL_IP:-127.0.0.1}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-d6Passwd}
      DB_NAME: ${POSTGRES_DB:-cloudland}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cloudland.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-passw0rd}
      CLOUDLAND_HOST: ${MANAGEMENT_VIP:-127.0.0.1}
      MONITOR_HOST: prometheus
      MONITOR_PORT: "9090"
      ALARM_RULES_MANAGER_HOST: alarm-rules-mgr
      CPGATEWAY_SECRET_KEY: ${CPGATEWAY_SECRET_KEY:-change-me-in-production}
      # VNC Console URL 配置 (多 Region 模式下指向 Region Gateway 地址)
      # 留空时回退到请求的 Host，单节点模式开箱即用
      CONSOLE_HOST: ${CONSOLE_HOST:-}
      CONSOLE_PORT: "${CONSOLE_PORT:-}"
      # S3 镜像仓库（为空则回退到 legacy 本地模式）
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-images}
      S3_REGION: ${S3_REGION:-}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_UPLOAD_TIMEOUT_MINUTES: ${S3_UPLOAD_TIMEOUT_MINUTES:-120}
      # MinIO 内部域名（写入 dnsmasq hyper-hosts，clapi 启动时注册）
      MINIO_HOSTNAME: ${MINIO_HOSTNAME:-images.cloudland.internal}
      # compute → clapi → MinIO 转发配置（capture 上传路径用）
      CLAPI_HOSTNAME: ${CLAPI_HOSTNAME:-clapi.cloudland.internal}
      CLAPI_INTERNAL_URL: ${CLAPI_INTERNAL_URL:-}
      CAPTURE_UPLOAD_SECRET: ${CAPTURE_UPLOAD_SECRET:-}
      # VPN gateway credentials (IPsec PSKs, WireGuard keys) are encrypted at rest with a key derived from this
      VPN_SECRET_KEY: ${VPN_SECRET_KEY:-}
      # 访问 cland-go 的共享令牌，同时写入计算节点 deploy_command
      GRPC_AUTH_TOKEN: ${GRPC_AUTH_TOKEN:-}
      # 计算节点 deploy_command 使用的代码分支与脚本地址（DEPLOY_SCRIPT_URL 为空时按 REPO_BRANCH 拼接）
      REPO_BRANCH: ${REPO_BRANCH:-staging}
      DEPLOY_SCRIPT_URL: ${DEPLOY_SCRIPT_URL:-}
      # 链路追踪：OTLP 导出到本 Region 的 OTel Collector
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      TRACING_SAMPLE_RATIO: ${TRACING_SAMPLE_RATIO:-1}
      TRACING_BACKGROUND_SAMPLE_RATIO: ${TRACING_BACKGROUND_SAMPLE_RATIO:-0.01}
    volumes:
      - ./volumes/certs:/certs:ro
      - ./volumes/certs/cland/selfsigned.crt:/etc/ssl/certs/alarm_rules_manager.crt:ro
      - ../.ssh:/opt/cloudland/deploy/.ssh:ro
      - ./volumes/prometheus/node_templates:/etc/prometheus/node_templates:ro
      - ../dns:/opt/cloudland/dns
      - /var/run/docker.sock:/var/run/docker.sock  # 用于向 dnsmasq 发送 SIGHUP；已知安全取舍
    ports:
      - "${INTERNAL_IP:-127.0.0.1}:8255:8255"
      - "${INTERNAL_IP:-127.0.0.1}:5005:5005"
    networks:
      cloudland:
        ipv4_address: 172.28.0.30
    depends_on:
      # 内置 MinIO 模式：等 minio healthy；外部 S3 模式：minio 容器不启动，required: false 自动忽略
      minio:
        condition: service_healthy
        required: false

  # ---------- Console Proxy (VNC) ----------
  consoleproxy:
    build:
      context: ../../
      dockerfile: deploy/docker/dockerfiles/Dockerfile.consoleproxy
    image: cloudland-consoleproxy:latest
    container_name: cloudland-consoleproxy
    restart: unless-stopped
    profiles:
      - region
    volumes:
      - ./volumes/certs/console:/certs/console:ro
    ports:
      - "${INTERNAL_IP:-127.0.0.1}:9443:9443"
    networks:
      cloudland:
        ipv4_address: 172.28.0.40

  # ---------- Control Plane Gateway 控制平面网关 (profile: dev, full) ----------
  cpgateway:
    build:
      context: ../../
      dockerfile: deploy/docker/dockerfiles/Dockerfile.cpgateway
    image: cloudland-cpgateway:latest
    container_name: cloudland-cpgateway
    restart: unless-stopped
    profiles:
      - dev
      - full
    environment:
      # 环境变量覆盖 cpgateway/conf/config.toml 中的键: db.uri → DB_URI, auth.secret_key → AUTH_SECRET_KEY
      # SMTP_* / FEISHU_* / FRONTEND_URL / DNS_UPSTREAM 仅作兜底，系统设置页面保存的值优先
      DB_TYPE: postgres
      DB_URI: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-d6Passwd}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${CPGATEWAY_DB:-cloudland_cpgateway}"
      AUTH_SECRET_KEY: ${CPGATEWAY_SECRET_KEY:-change-me-in-production}
      AUTH_RSA_PRIVATE_KEY_PATH: /app/keys/private.pem
      AUTH_RSA_PUBLIC_KEY_PATH: /app/keys/public.pem
      SUPERUSER_EMAIL: ${ADMIN_EMAIL:-admin@cloudland.local}
      SUPERUSER_USERNAME: ${CPGATEWAY_ADMIN_USER:-admin}
      SUPERUSER_PASSWORD: ${ADMIN_PASSWORD:-passw0rd}
      FRONTEND_URL: "https://${PUBLIC_IP:-127.0.0.1}"
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-True}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASS:-}
      SMTP_FROM: ${ALERT_SENDER:-noreply@cloudland.local}
      SMTP_FROM_NAME: "CloudLand"
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      FEISHU_SECRET: ${FEISHU_SECRET:-}
      DNS_UPSTREAM: ${DNS_UPSTREAM:-8.8.8.8}
      SERVER_LISTEN_ADDR: "0.0.0.0"
      SERVER_LISTEN_PORT: "8000"
      # 链路追踪：导出到本机 OTel Collector；在 .env 设 CPGATEWAY_OTLP_ENDPOINT= 可关闭导出
      OTEL_EXPORTER_OTLP_ENDPOINT: ${CPGATEWAY_OTLP_ENDPOINT-http://otel-collector:4317}
      # 前端浏览器上报的 span 经网关（需登录）转发到 Collector OTLP/HTTP；设为空则丢弃
      TRACING_BROWSER_OTLP_ENDPOINT: ${CPGATEWAY_OTLP_HTTP_ENDPOINT-http://otel-collector:4318}
      TRACING_SAMPLE_RATIO: ${TRACING_SAMPLE_RATIO:-1}
      TRACING_BACKGROUND_SAMPLE_RATIO: ${TRACING_BACKGROUND_SAMPLE_RATIO:-0.01}
    volumes:
      - cpgateway_keys:/app/keys
    ports:
      - "${INTERNAL_IP:-127.0.0.1}:8000:8000"
    networks:
      cloudland:
        ipv4_address: 172.28.0.96
    depends_on:
      clapi:
        condition: service_started
        required: false

  # ---------- Nginx 反向代理 (profile: full) ----------
  nginx:
    build:
      context: ../../
      dockerfile: deploy/docker/dockerfiles/Dockerfile.nginx-ui
    image: cloudland-nginx-ui:latest
    container_name: cloudland-nginx
    restart: unless-stopped
    profiles:
      - full
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./volumes/certs/nginx:/certs/nginx:ro
      - image_cache:/opt/cloudland/cache/image
    ports:
      - "80:80"
      - "443:443"
      # Image cache directory. Compute nodes fetch over the internal network;
      # on 0.0.0.0 it was an open file server on the public internet
      - "${INTERNAL_IP:-127.0.0.1}:4000:4000"
    networks:
      cloudland:
        ipv4_address: 172.28.0.50
    depends_on:
      cpgateway:
        condition: service_started
      consoleproxy:
        condition: service_started
        required: false

  # ---------- Prometheus ----------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: cloudland-prometheus
    restart: unless-stopped
    profiles:
      - region
    user: "nobody"
    environment:
      CLAPI_SD_ENDPOINT: "${CLAPI_SD_ENDPOINT:-https://clapi:8255}"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./volumes/prometheus/general_rules:/etc/prometheus/general_rules
      - ./volumes/prometheus/rules_enabled:/etc/prometheus/rules_enabled
      - ./volumes/prometheus/lists:/etc/prometheus/lists:ro
      - ./config/prometheus/tracing_rules:/etc/prometheus/tracing_rules:ro
      - prometheus_data:/prometheus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed "s|__CLAPI_SD_ENDPOINT__|$$CLAPI_SD_ENDPOINT|g" \
          /etc/prometheus/prometheus.yml.tmpl > /tmp/prometheus.yml &&
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.retention.time=720h \
          --storage.tsdb.path=/prometheus \
          --web.enable-lifecycle
    ports:
      # No authentication: anyone reaching it can query every metric, which is a
      # full inventory of hosts, instances and resource usage
      - "${INTERNAL_IP:-127.0.0.1}:9090:9090"
    networks:
      cloudland:
        ipv4_address: 172.28.0.60
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------- Alertmanager ----------
  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.26.0
    container_name: cloudland-alertmanager
    restart: unless-stopped
    profiles:
      - region
    user: "65534:65534"
    volumes:
      - ./volumes/alertmanager:/data
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    # alertmanager.yml 需根据实际环境配置
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/data"
      - "--data.retention=720h"
    ports:
      # No authentication: its API exposes the receiver config and lets anyone
      # silence every alert
      - "${INTERNAL_IP:-127.0.0.1}:9093:9093"
    networks:
      cloudland:
        ipv4_address: 172.28.0.70
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9093/-/healthy",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------- Grafana ----------
  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: cloudland-grafana
    restart: unless-stopped
    profiles:
      - region
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Tempo 查询地址：多 Region 统一存储时指向中央 Tempo（http://<中央内网IP>:3200）
      TEMPO_QUERY_URL: ${TEMPO_QUERY_URL:-http://tempo:3200}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      # Not proxied by nginx, so it was only ever reachable on this port directly.
      # Login is required, but there is no reason to offer it to the internet:
      # reach it over an SSH tunnel (ssh -L 3000:<INTERNAL_IP>:3000 <host>)
      - "${INTERNAL_IP:-127.0.0.1}:3000:3000"
    networks:
      cloudland:
        ipv4_address: 172.28.0.80
    depends_on:
      prometheus:
        condition: service_healthy

  # ---------- Loki ----------
  loki:
    image: grafana/loki:2.9.2
    container_name: cloudland-loki
    restart: unless-stopped
    profiles:
      - region
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      # 计算节点 promtail-agent 经 CONTROLLER_IP（= MANAGEMENT_VIP）推送日志。与 cland 5006 同策略默认绑定全部地址：
      # HA 下 VIP 可能不在本机，Docker 绑定本机不存在的 IP 会启动失败。Loki 写入无鉴权，且 Docker 映射端口绕过宿主
      # INPUT 链，部署脚本未对 5006/3100/4317 做来源限制，依赖内网隔离（安全组/外部防火墙禁止公网访问）；
      # 非 HA 部署可设 TELEMETRY_LISTEN_IP=INTERNAL_IP 缩小暴露面
      - "${TELEMETRY_LISTEN_IP:-0.0.0.0}:3100:3100"
    networks:
      cloudland:
        ipv4_address: 172.28.0.81

  # ---------- Promtail ----------
  promtail:
    image: grafana/promtail:2.9.2
    container_name: cloudland-promtail
    restart: unless-stopped
    profiles:
      - region
    volumes:
      - ./config/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - cland_log:/opt/cloudland/log:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      cloudland:
        ipv4_address: 172.28.0.82
    depends_on:
      - loki

  # ---------- OTel Collector 链路数据接收 ----------
  # 接收服务、计算节点与浏览器的 span：计算服务拓扑与 RED 指标（:8889 供 Prometheus 抓取），尾部采样后导出到 Tempo
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: cloudland-otel-collector
    restart: unless-stopped
    profiles:
      - region
      - full
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      # 多 Region 统一存储时指向中央节点 Collector（<中央内网IP>:4317）
      TRACING_BACKEND_ENDPOINT: ${TRACING_BACKEND_ENDPOINT:-tempo:4317}
      TAIL_SAMPLING_PERCENT: ${TAIL_SAMPLING_PERCENT:-100}
      TAIL_SAMPLING_LATENCY_MS: ${TAIL_SAMPLING_LATENCY_MS:-2000}
    volumes:
      - ./config/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # OTLP gRPC：计算节点 cloudlet 经 CONTROLLER_IP（= MANAGEMENT_VIP）、host 网络下的 cland 经 INTERNAL_IP、
      # 其他 Region 的 Collector 经内网地址导出。与 cland 5006 同策略默认绑定全部地址（HA 下 VIP 可能不在本机）；
      # OTLP 接收无鉴权，依赖内网隔离，同 loki 3100 的说明；非 HA 部署可设 TELEMETRY_LISTEN_IP=INTERNAL_IP
      - "${TELEMETRY_LISTEN_IP:-0.0.0.0}:4317:4317"
    networks:
      cloudland:
        ipv4_address: 172.28.0.84
    depends_on:
      - tempo

  # ---------- Tempo 链路追踪 ----------
  # 镜像以 10001 用户运行且 /var/tempo 属主为 10001，命名卷首次挂载时继承该属主
  tempo:
    image: grafana/tempo:2.10.8
    container_name: cloudland-tempo
    restart: unless-stopped
    profiles:
      - region
      - full
    command: -config.file=/etc/tempo/tempo.yaml -config.expand-env=true
    environment:
      TEMPO_RETENTION: ${TEMPO_RETENTION:-168h}
      TEMPO_STORAGE_BACKEND: ${TEMPO_STORAGE_BACKEND:-local}
      TEMPO_S3_ENDPOINT: ${TEMPO_S3_ENDPOINT:-}
      TEMPO_S3_BUCKET: ${TEMPO_S3_BUCKET:-tempo}
      TEMPO_S3_ACCESS_KEY: ${TEMPO_S3_ACCESS_KEY:-}
      TEMPO_S3_SECRET_KEY: ${TEMPO_S3_SECRET_KEY:-}
      TEMPO_S3_INSECURE: ${TEMPO_S3_INSECURE:-true}
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      # 查询 API：多 Region 统一存储时，其他 Region 的 Grafana 通过 TEMPO_QUERY_URL 访问；仅绑定内网
      - "${INTERNAL_IP:-127.0.0.1}:3200:3200"
    networks:
      cloudland:
        ipv4_address: 172.28.0.83

  # ---------- Alarm Rules Manager ----------
  alarm-rules-mgr:
    build:
      context: ../../
      dockerfile: deploy/docker/dockerfiles/Dockerfile.web
      target: alarm-rules-manager
    image: cloudland-alarm-rules-manager:latest
    container_name: cloudland-alarm-rules-mgr
    restart: unless-stopped
    profiles:
      - region
    environment:
      ALARM_RULES_LISTEN: "0.0.0.0:8256"
      ALARM_RULES_CERT: "/certs/cland/selfsigned.crt"
      ALARM_RULES_KEY: "/certs/cland/selfsigned.key"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      TRACING_SAMPLE_RATIO: ${TRACING_SAMPLE_RATIO:-1}
      TRACING_BACKGROUND_SAMPLE_RATIO: ${TRACING_BACKGROUND_SAMPLE_RATIO:-0.01}
    volumes:
      - ./volumes/certs:/certs:ro
      - ./volumes/prometheus/general_rules:/etc/prometheus/general_rules
      - ./volumes/prometheus/rules_enabled:/etc/prometheus/rules_enabled
      - ./volumes/prometheus/node_templates:/etc/prometheus/node_templates:ro
      - ./volumes/prometheus/lists:/etc/prometheus/lists
    ports:
      # Bind to the internal address only, like clapi's 8255. This service has no
      # authentication and its API reads, writes, chowns and deletes files on the
      # Prometheus host, so publishing it on 0.0.0.0 exposed arbitrary file access
      # to the public internet. clapi reaches it by container name over the compose
      # network and does not need the published port at all; it is kept on the
      # internal address only for the Swagger UI.
      - "${INTERNAL_IP:-127.0.0.1}:8256:8256"
    networks:
      cloudland:
        ipv4_address: 172.28.0.90
    depends_on:
      prometheus:
        condition: service_healthy

  # ---------- MinIO 镜像仓库（内置模式，profile: minio）----------
  # 外部 S3 模式不加 minio profile，容器不启动
  minio:
    image: quay.io/minio/minio:latest
    container_name: cloudland-minio
    restart: unless-stopped
    profiles:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cloudland}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    ports:
      - "${INTERNAL_IP:-127.0.0.1}:9000:9000"
      - "${INTERNAL_IP:-127.0.0.1}:9001:9001"
    networks:
      cloudland:
        ipv4_address: 172.28.0.95
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- MinIO Bucket 初始化（一次性作业）----------
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: cloudland-minio-init
    profiles:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cloudland}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-images}
    entrypoint: >
      /bin/sh -c "
      until mc alias set cland http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing cland/$${S3_BUCKET};
      mc anonymous set none cland/$${S3_BUCKET};
      echo 'Bucket initialized (private, access via presigned URL only).';
      echo 'TIP: configure lifecycle rule to abort incomplete multipart uploads periodically (mc flag depends on version).';
      "
    networks:
      cloudland:
    depends_on:
      minio:
        condition: service_healthy

  # ---------- Region Gateway (VNC WebSocket 边缘入口) ----------
  # 多 Region 部署时，每个远程 Region 通过此 Nginx 在边缘终结 TLS，
  # 将 /websockify 转发给内部 consoleproxy。
  # 单节点模式 (full,dev,region) 不需要此服务，中央 Nginx 直接处理。
  region-gateway:
    image: nginx:alpine
    container_name: cloudland-region-gateway
    restart: unless-stopped
    profiles:
      - region-gateway
    volumes:
      - ./config/region-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./volumes/certs/region-gw:/certs/region-gw:ro
    ports:
      - "${REGION_GATEWAY_PORT:-8443}:443"
    networks:
      cloudland:
        ipv4_address: 172.28.0.45
    depends_on:
      - consoleproxy

# ---------- 网络 ----------
networks:
  cloudland:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: cloudland-br
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ---------- 持久化卷 ----------
volumes:
  pg_data:
    name: cloudland-pg-data
  prometheus_data:
    name: cloudland-prometheus-data
  grafana_data:
    name: cloudland-grafana-data
  cland_log:
    name: cloudland-cland-log
  cland_cache:
    name: cloudland-cland-cache
  image_cache:
    name: cloudland-image-cache
  cpgateway_keys:
    name: cloudland-cpgateway-keys
  loki_data:
    name: cloudland-loki-data
  tempo_data:
    name: cloudland-tempo-data
  minio_data:
    name: cloudland-minio-data
