# cland-go 强制要求 gRPC 共享令牌
- name: check grpc auth token
  assert:
    that: grpc_auth_token is defined and grpc_auth_token | length > 0
    fail_msg: "grpc_auth_token 未设置：cland-go 无令牌时拒绝启动（见 netconf.yml.example）"
  tags: [always]

# 使用file模块创建核心目录/opt/cloudland和系统目录/usr/bin；
# 指定目录属主为cland用户，确保权限基础。
- name: creates cloudland directory
  file:
    path: "{{ item }}"
    state: directory
    owner: cland
  with_items:
    - /opt/cloudland
    - /usr/bin
  tags: [sync]

#使用synchronize模块（基于 rsync）同步/opt/cloudland目录到目标主机的/opt目录；
# 排除cache/log/db目录（避免同步临时 / 数据文件）；
# 仅在跨主机部署时执行（非本地主机）。
- name: synchronize cloudland
  synchronize:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    rsync_opts: "--exclude=cache,--exclude=log,--exclude=db"
  with_items:
    - { src: "/opt/cloudland", dest: "/opt", owner: "cland" }
  tags: [sync]
  when: inventory_hostname != ansible_facts['hostname']

# 创建目录
- name: create directores
  file:
    path: "{{ item }}"
    state: directory
    owner: cland
    group: cland
  with_items:
    - "/opt/cloudland/log"
    - "/opt/cloudland/run"
    - "/opt/cloudland/cache"
    - "/opt/cloudland/cache/image"
    - "/opt/cloudland/cache/instance"
    - "/opt/cloudland/cache/router"
  tags: [fe_dir]

# 创建目录
- name: create sysconfig directory
  file:
    path: "/etc/sysconfig"
    state: directory
    owner: root
    group: root
  tags: [fe_dir]

# 拷贝 cland-go 二进制（build.sh 编译到 /opt/cloudland/bin）与脚本（callback 本地执行）
- name: copy cland-go binaries and scripts
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: preserve
  with_items:
    - { src: "/opt/cloudland/bin", dest: "/opt/cloudland", owner: "cland" }
    - { src: "/opt/cloudland/scripts", dest: "/opt/cloudland", owner: "cland" }
  tags: [fe_bin]
  when: inventory_hostname != ansible_facts['hostname']

# 拷贝服务文件
- name: copy cland-go service files
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  with_items:
    - { src: "cland-go.service", dest: "/lib/systemd/system", mode: "0644" }
    - { src: "cland-go.sh", dest: "/usr/local/bin", mode: "0755" }
  tags: [fe_srv]

# 创建环境文件（含令牌，仅 root 可读；systemd 以 root 读取 EnvironmentFile）
- name: create cland-go environment file
  template:
    src: cland-go.j2
    dest: /etc/sysconfig/cland-go
    owner: root
    group: root
    mode: "0600"
  tags: [fe_srv]

# 启动服务
- name: start cland-go service
  systemd:
    name: cland-go
    enabled: yes
    daemon_reload: yes
    state: restarted
  when: not ansible_check_mode
  tags: [fe_srv]
