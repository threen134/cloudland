# cloudlet-go 向 cland-go 注册需要 gRPC 共享令牌
- name: check grpc auth token
  assert:
    that: grpc_auth_token is defined and grpc_auth_token | length > 0
    fail_msg: "grpc_auth_token 未设置：cloudlet-go 将被 cland-go 拒绝（见 netconf.yml.example）"
  tags: [always]

- name: install common packages
  apt:
    name:
      ["jq", "wget", "mkisofs", "network-manager", "net-tools", "python3-pip"]
    update_cache: yes
    state: present
  ignore_errors: yes
  tags: [be_pkg]

- name: install packages for kvm
  apt:
    name:
      [
        "qemu-system-x86",
        "qemu-utils",
        "bridge-utils",
        "ipcalc",
        "ipset",
        "keepalived",
        "haproxy",
        "iputils-arping",
        "libvirt-daemon",
        "libvirt-daemon-system",
        "libvirt-daemon-system-systemd",
        "libvirt-clients",
        "dnsmasq",
        "dnsmasq-utils",
        "conntrack",
        "cloud-utils",
      ]
    state: present
  ignore_errors: yes
  tags: [be_pkg]

- name: install pyparsing
  apt:
    name: python3-pyparsing
    state: present
  ignore_errors: yes
  when:
    - ansible_facts.distribution == "Ubuntu"
    - ansible_facts.distribution_version is version('26.04', '>=')
  tags: [be_pkg]

- pip:
    name: pyparsing
    executable: pip3
  ignore_errors: yes
  when:
    - ansible_facts.distribution == "Ubuntu"
    - ansible_facts.distribution_version is version('26.04', '<')
  tags: [be_pkg]

- name: creates cloudland directory
  file:
    path: "{{ item }}"
    state: directory
    owner: cland
    group: cland
  with_items:
    - /opt/cloudland
    - /opt/cloudland/log
    - /opt/cloudland/run
    - /opt/cloudland/cache
    - /opt/cloudland/cache/backup
    - /opt/cloudland/cache/image
    - /opt/cloudland/cache/instance
    - /opt/cloudland/cache/meta
    - /opt/cloudland/cache/router
    - /opt/cloudland/cache/volume
    - /opt/cloudland/cache/dnsmasq
    - /opt/cloudland/cache/xml
    - /opt/cloudland/cache/qemu_agent
  tags: [sync]

- name: create sysconfig directory
  file:
    path: "/etc/sysconfig"
    state: directory
    owner: root
    group: root
  tags: [be_srv, cloudlet]

- name: copy scripts
  synchronize:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  with_items:
    - {
        src: "/opt/cloudland/scripts",
        dest: "/opt/cloudland",
        owner: "cland",
        group: "cland",
      }
  tags: [sync, scripts, scripts_only]

- name: set executable permissions for all kvm scripts
  file:
    path: /opt/cloudland/scripts/kvm
    mode: "0755"
    recurse: yes
    state: directory
  tags: [scripts, scripts_only]

- name: link backend to kvm
  file:
    src: /opt/cloudland/scripts/kvm
    dest: /opt/cloudland/scripts/backend
    state: link
    force: yes
    owner: "cland"
    group: "cland"
  tags: [be_conf, scripts, scripts_only]

- name: register network_device
  script: get_netdev.sh "{{ hostvars[inventory_hostname]['ansible_facts']['env']['SSH_CONNECTION'].split(' ')[2] }}"
  register: netdev

- name: create cloudrc local file for kvm
  vars:
    network_device: "{{ netdev.stdout_lines[0] }}"
    vxlan_device: "{{ network_device }}"
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
  with_items:
    - {
        src: "cloudrc.local.kvm-x86_64.j2",
        dest: "/opt/cloudland/scripts/cloudrc.local",
        owner: "cland",
        group: "cland",
      }
  when: virt_type == 'kvm-x86_64'
  tags: [be_conf, scripts]

# 同步 /opt/cloudland/bin（含 build.sh 编译的 cloudlet-go）
- name: synchronize cloudlet
  synchronize:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  with_items:
    - {
        src: "/opt/cloudland/bin",
        dest: "/opt/cloudland",
        owner: "cland",
        group: "cland",
      }
  tags: [sync, cloudlet]

# 环境文件含令牌，仅 root 可读（systemd 以 root 读取 EnvironmentFile）
- name: create cloudlet-go environment file
  template:
    src: cloudlet.j2
    dest: /etc/sysconfig/cloudlet
    owner: root
    group: root
    mode: "0600"
  tags: [be_srv, cloudlet]

- name: copy cloudlet-go service file
  copy:
    src: cloudlet-go.service
    dest: /lib/systemd/system/cloudlet-go.service
    mode: "0644"
  tags: [be_srv, cloudlet]

- name: copy compute service file
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: preserve
  with_items:
    - { src: "kvm-nested.conf", dest: "/etc/modprobe.d", owner: "root" }
  tags: [be_srv]

- name: start cloudlet-go service
  systemd:
    name: cloudlet-go
    enabled: yes
    daemon_reload: yes
    state: restarted
  when: not ansible_check_mode
  tags: [be_srv, cloudlet]

- name: set compute libvirt service
  systemd:
    name: "{{ item }}"
    enabled: yes
    daemon_reload: yes
    state: restarted
  with_items:
    - "libvirtd"
  when: not ansible_check_mode
  tags: [be_srv]

- name: undefine default libvirt network
  command: bash -c "virsh net-destroy default; virsh net-undefine default"
  ignore_errors: yes
  tags: [be_srv]

- name: set compute services NetworkManager
  systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  with_items:
    - "NetworkManager"
  tags: [be_srv, netplan]

- name: change netplan renderer
  script: change_netplan_renderer.sh
  register: need_to_reboot
  tags: [be_srv, netplan]

- name: reboot compute node if needed
  vars:
    need_reboot: "{{ need_to_reboot.stdout_lines[0] }}"
  ansible.builtin.reboot:
  when:
    - not ansible_check_mode
    - need_reboot == 'need_to_reboot'
    - inventory_hostname != ansible_hostname
  tags: [netplan]

- name: stop and mask networkd
  systemd:
    name: "{{ item }}"
    enabled: false
    masked: yes
    state: stopped
  with_items:
    - "systemd-networkd"
  when: not ansible_check_mode
  tags: [be_srv, netplan]

- name: Create .ssh directory if not exists
  file:
    path: ~/.ssh
    state: directory
    mode: "0700"
  when: not ansible_check_mode
  tags: [ssh_key]

- name: Add SSH public key to authorized_keys
  authorized_key:
    user: root
    state: present
    key: "{{ lookup('file', '/tmp/.ssh/cland.key.pub') }}"
  when: not ansible_check_mode
  tags: [ssh_key]

- name: Copy private key to target nodes
  copy:
    src: /tmp/.ssh/cland.key
    dest: ~/.ssh/id_rsa
    mode: "0600"
  when: not ansible_check_mode
  tags: [ssh_key]

- name: Remove pub key if present
  file:
    path: ~/.ssh/id_rsa.pub
    state: absent
  tags: [ssh_key]

- name: allow necessary ports for hypervisor
  script: firewall.sh
  tags: [firewall]

- name: Load nr_bridge kernel module
  modprobe:
    name: br_netfilter
    state: present
  tags: [sysctl]

- name: Apply sysctl bridge-nf-call-iptables
  sysctl:
    name: net.bridge.bridge-nf-call-iptables
    state: present
    value: "1"
    reload: yes
  tags: [sysctl]

- name: Apply sysctl bridge-nf-call-arptables
  sysctl:
    name: net.bridge.bridge-nf-call-arptables
    state: present
    value: "1"
    reload: yes
  tags: [sysctl]

- name: Apply sysctl bridge-nf-call-ip6tables
  sysctl:
    name: net.bridge.bridge-nf-call-ip6tables
    state: present
    value: "1"
    reload: yes
  tags: [sysctl]

- name: Apply sysctl net.netfilter.nf_conntrack_max
  sysctl:
    name: net.netfilter.nf_conntrack_max
    state: present
    value: "6553600"
    reload: yes
  tags: [sysctl]

- name: Apply sysctl net.core.rmem_max
  sysctl:
    name: net.core.rmem_max
    state: present
    value: "16777216"
    reload: yes
  tags: [sysctl]

- name: Apply sysctl net.core.wmem_max
  sysctl:
    name: net.core.wmem_max
    state: present
    value: "16777216"
    reload: yes
  tags: [sysctl]
