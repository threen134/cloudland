# 这份代码文件是一个 Ansible Playbook（`main.yml`），核心用途是**自动化部署和配置基于 Prometheus 生态的主机/虚拟化监控体系**，主要面向运行 libvirt 虚拟化（如 KVM）的 Linux 主机，所有任务均带有 `monitor` 标签，可按需单独执行。以下是分模块的详细说明：

# ### 一、Docker 环境准备
# 为运行 `libvirt-exporter` 容器做前置环境保障：
# 1. **安装 Python Docker SDK**：通过 `pip3` 安装 `docker` 库，用于 Ansible 管理 Docker 容器；
# 2. **检查 Docker 状态**：执行 `docker info` 检测 Docker 是否安装并运行，结果注册为 `docker_status`；
# 3. **安装/启动 Docker**：若 Docker 未运行，则通过 `apt` 安装 `docker.io`，并通过 `systemd` 启动 Docker 服务且设置开机自启。

# ### 二、libvirt 虚拟化监控部署
# 部署 `libvirt-exporter` 容器（Prometheus 专属的 libvirt 监控采集器）：
# - 容器镜像：`kiennt26/prometheus-libvirt-exporter:latest`；
# - 网络模式：`host`（复用主机网络栈，无需端口映射）；
# - 关键挂载：
#   - `/:/host:ro,rslave`：只读挂载主机根目录，用于采集系统辅助监控数据；
#   - `/var/run/libvirt:/var/run/libvirt`：挂载 libvirt 运行时目录，获取虚拟机/存储池等核心虚拟化指标；
# - 容器配置：特权模式、开机自启，确保稳定采集 libvirt 指标并暴露给 Prometheus。

# ### 三、主机基础监控（node-exporter 配置）
# `prometheus-node-exporter` 是主机级核心监控组件，负责采集 CPU/内存/磁盘/网络等基础指标，此处做定制化配置：
# 1. **安装并停止默认服务**：通过 `apt` 安装组件，但先停止默认服务（避免端口冲突）；
# 2. **自定义端口与采集目录**：
#    - 覆盖默认配置，将监听端口改为 `9101`（默认 9100）；
#    - 启用 `textfile` 采集器，指定目录 `/var/lib/node_exporter`（用于读取自定义监控指标文件，如 `ipset_blocked_ips.prom`）；
# 3. **重启并保障服务**：重载 systemd 配置，重启服务并验证启动状态（重试 3 次，间隔 5 秒），确保服务稳定运行；
# 4. **创建数据目录**：为 `textfile` 采集器创建目录，设置权限为 `prometheus` 用户/组。

# ### 四、网络连接跟踪（conntrack）清理
# 为避免旧配置冲突，清理与 `conntrack` 相关的旧系统服务/脚本：
# 1. **检查并停止旧服务**：检测 `conntrack-collection.service/timer` 是否存在，若存在则停止并禁用；
# 2. **删除旧文件**：删除旧的 systemd 配置文件和脚本文件（`conntrack_unreplied_syn.sh`）；
# 3. **重载 systemd**：确保清理后的配置生效。

# ### 五、自定义网络监控（IP 封禁/丢包采集）
# 通过 systemd 的 `service + timer` 定时任务，部署两个自定义监控脚本，将指标写入 `node-exporter` 的 `textfile` 目录：
# #### 1. IP 封禁监控（ip-block-exporter）
# - 部署 `ip-block-exporter.service/timer` 配置文件（基于 Jinja2 模板）；
# - 重载 systemd 并启动定时器，定时执行 `/opt/cloudland/scripts/monitor/export_blocked_ips.sh`，采集 IP 封禁相关指标。

# #### 2. 网络丢包监控（packet-drop-exporter）
# - 部署 `packet-drop-exporter.service/timer` 配置文件；
# - 重载 systemd 并启动定时器，定时执行 `/opt/cloudland/scripts/monitor/export_packet_drops.sh`，采集网络丢包相关指标。

# ### 核心设计逻辑
# 1. **分层监控**：虚拟化层（libvirt-exporter）+ 主机层（node-exporter）+ 自定义网络层（IP封禁/丢包），覆盖从基础主机到业务网络的全维度监控；
# 2. **兼容性保障**：清理旧配置、自定义端口、重试机制，避免部署冲突；
# 3. **自动化运维**：通过 Ansible 一键部署，所有组件开机自启，定时任务保障指标持续采集；
# 4. **指标整合**：自定义监控指标写入 `node-exporter` 的 `textfile` 目录，统一由 node-exporter 暴露，Prometheus 只需抓取 node-exporter 即可获取所有指标，简化采集配置。

# 整体而言，该 Playbook 实现了“开箱即用”的监控部署能力，适配 libvirt 虚拟化主机的监控需求，兼顾基础指标与自定义网络指标，符合 Prometheus 监控生态的最佳实践。
# Install Docker SDK for Python to manage Docker containers
- name: Install Docker SDK for Python
  become: true
  pip:
    name: docker
    executable: pip3
  tags: [monitor]

# Check if Docker is installed and running
- name: Check if Docker is running
  become: true
  command: docker info
  register: docker_status
  ignore_errors: true
  changed_when: false
  tags: [monitor]

# Install Docker if not present
- name: Install Docker if not present
  become: true
  apt:
    name: docker.io
    state: present
  when: docker_status.rc != 0
  tags: [monitor]

# Start Docker service if not running
- name: Start Docker service if not running
  become: true
  systemd:
    name: docker
    state: started
    enabled: yes
  when: docker_status.rc != 0
  tags: [monitor]

# Run libvirt-exporter in Docker
#核心功能是在目标主机上通过 Docker 容器
#运行 libvirt-exporter（用于监控 libvirt 虚拟化环境的 Prometheus 采集器）
# network_mode: host：容器使用 主机网络模式，容器直接复用主机的网络栈（端口、网卡等），
# 无需端口映射，Prometheus 可直接通过主机 IP + 默认端口抓取数据。
# /:/host:ro,rslave：将主机根目录 / 以 只读（ro） 模式挂载到容器的 /host 目录，rslave 是递归从属挂载（确保子目录也能正常访问），目的是让导出器读取主机的系统信息（如硬件、文件系统等辅助监控数据）。
# /var/run/libvirt:/var/run/libvirt：挂载 libvirt 的运行时目录（包含 libvirt 的 socket 文件），导出器通过该目录与主机的 libvirt 服务通信，获取虚拟机、存储池等核心监控数据。
# 通过 Ansible 自动化在目标主机（通常是运行 libvirt 虚拟化（如 KVM）的服务器）上部署 libvirt-exporter 容器，该容器会采集 libvirt 相关的监控指标（虚拟机状态、CPU / 内存使用率、存储池容量等），并暴露给 Prometheus，最终实现对 libvirt 虚拟化平台的监控。
- name: Run libvirt-exporter in Docker
  become: true
  docker_container:
    name: prometheus-libvirt-exporter
    image: "kiennt26/prometheus-libvirt-exporter:latest"
    network_mode: host
    volumes:
      - "/:/host:ro,rslave"
      - "/var/run/libvirt:/var/run/libvirt"
    privileged: yes
    restart_policy: always
  tags: [monitor]

# 创建目录用于存放监控脚本
- name: Create directory for monitor scripts
  file:
    path: /opt/cloudland/scripts/monitor
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: [monitor]

# 设置 node exporter 端口变量
- name: Set node exporter port variable
  set_fact:
    node_exporter_port: 9101
  tags: [monitor]

# 安装 node exporter，但不启动服务
# 一、prometheus-node-exporter 核心说明
# prometheus-node-exporter 是 Prometheus 生态中最基础、最核心的 主机级监控导出器（Exporter），本质是一个轻量级进程（或容器），核心作用是：
# 采集主机底层指标：运行在 Linux/Windows 主机上，收集服务器的 “基础物理 / 系统信息”，比如：
# CPU 使用率、负载、上下文切换；
# 内存使用率、缓存、交换分区；
# 磁盘 IO、磁盘容量、文件系统使用率；
# 网络带宽、连接数、网卡状态；
# 主机 uptime（运行时间）、进程数、系统负载等。
# 暴露指标供 Prometheus 抓取：启动后默认监听 9100 端口，通过 http://主机IP:9100/metrics 接口以 Prometheus 能识别的格式（文本格式）输出指标，Prometheus 配置定时抓取该接口即可存储指标，后续结合 Grafana 做可视化。
- name: Install prometheus-node-exporter without starting
  become: true
  apt:
    name: prometheus-node-exporter
    state: present
  register: pkg_install
  ignore_errors: true
  tags: [monitor]

# 停止 node exporter
- name: Force stop node exporter after install
  become: true
  systemd:
    name: prometheus-node-exporter
    state: stopped
  ignore_errors: true
  changed_when: false
  when: pkg_install is succeeded
  tags: [monitor]

# 确保 Prometheus Node Exporter 的 systemd 覆盖配置目录存在并配置正确权限
- name: Ensure systemd override directory exists
  file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: [monitor]

# 创建 Prometheus Node Exporter 的 systemd 覆盖配置 端口号：9101
# collector.textfile.directory=/var/lib/node_exporter：启用 “文本文件采集器”，指定采集目录为/var/lib/node_exporter—— 用户可在该目录下放置自定义的监控指标文件（格式为.prom），
# Node Exporter 会自动读取并暴露这些指标给 Prometheus。
# /var/lib/node_exporter
# ipset_blocked_ips.prom  packet_drop_indicators.prom
- name: Configure Node Exporter with textfile directory
  become: true
  copy:
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/prometheus-node-exporter --web.listen-address=:{{ node_exporter_port }} --collector.textfile.directory=/var/lib/node_exporter
    mode: '0644'
    owner: root
    group: root
  tags: [monitor]

# 应用 systemd 配置更改 prometheus-node-exporter
- name: Apply systemd configuration changes
  become: true
  systemd:
    daemon_reload: yes
    name: prometheus-node-exporter
  changed_when: false
  tags: [monitor]

# 启动 node exporter 并确保其开机自启
- name: Ensure service started with new config is enabled and started
  become: true
  systemd:
    name: prometheus-node-exporter
    enabled: yes
    state: restarted
    daemon_reload: no
  register: service_status
  until: service_status.status.ActiveState == "active"
  retries: 3
  delay: 5
  tags: [monitor]

# 创建 node exporter 数据目录
- name: Create node_exporter data directory
  file:
    path: /var/lib/node_exporter
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'
  tags: [monitor]

# 定义并初始化conntrack_collection_interval变量（用于 conntrack 连接跟踪数据的采集间隔），
- name: Set conntrack collection interval variable
  set_fact:
    conntrack_collection_interval: "{{ conntrack_collection_interval | default('2') }}"
  tags: [monitor]

# 安装 conntrack 工具包，用于网络连接跟踪和管理
- name: Install conntrack tools
  become: true
  apt:
    name: conntrack
    state: present
  tags: [monitor]

# 创建 conntrack-collection.service 和 conntrack-collection.timer 文件的检查和清理任务
- name: Check if conntrack-collection systemd units exist
  become: true
  command: systemctl list-units --all --no-pager --no-legend {{ item }}
  register: systemd_unit_check
  failed_when: false
  changed_when: false
  with_items:
    - conntrack-collection.timer
    - conntrack-collection.service
  tags: [monitor]

# 停止并禁用现有的 conntrack-collection systemd 单位
# 依赖前序任务 systemd_unit_check 检查所有 conntrack-collection 相关的 systemd 服务是否存在，
#收集检查结果到 systemd_unit_check.results。
# 遍历检查结果，仅筛选出 “服务存在”（返回码 0 + 输出非空）的条目。
# 对这些存在的服务，以管理员权限执行：停止服务 + 禁用开机自启。
# 任务可通过 monitor 标签单独调用，适用于监控相关的服务清理场景
- name: Stop and disable existing conntrack-collection systemd units
  become: true
  systemd:
    name: "{{ item.item }}"
    state: stopped
    enabled: no
  when: item.rc == 0 and item.stdout | length > 0
  with_items: "{{ systemd_unit_check.results }}"
  tags: [monitor]

# 该任务的目的是前置校验：在部署 / 启动 conntrack-collection 服务（可能是一个连接跟踪数据采集服务）前，
# 先确认其对应的 systemd 服务文件和定时器文件是否已存在于系统指定目录，为后续的服务启动、重载等操作做准备。
- name: Check if conntrack-collection systemd unit files exist
  become: true
  stat:
    path: "{{ item }}"
  register: systemd_file_check
  with_items:
    - /etc/systemd/system/conntrack-collection.service
    - /etc/systemd/system/conntrack-collection.timer
  tags: [monitor]

# 依赖前置任务 systemd_file_check，已提前检查了一批 “conntrack-collection 相关 systemd 单元文件” 的存在性；
# 循环遍历这些文件的检查结果；
# 对 “确实存在” 的文件，以 root 权限执行删除操作；
- name: Remove conntrack-collection systemd unit files
  become: true
  file:
    path: "{{ item.item }}"
    state: absent
  when: item.stat.exists
  with_items: "{{ systemd_file_check.results }}"
  tags: [monitor]

# 仅做 “检查” 操作（不修改系统），判断 /opt/cloudland/scripts/monitor/conntrack_unreplied_syn.sh 脚本文件是否存在，
- name: Check if conntrack_unreplied_syn.sh script exists
  become: true
  stat:
    path: /opt/cloudland/scripts/monitor/conntrack_unreplied_syn.sh
  register: script_check
  tags: [monitor]

# 删除 /opt/cloudland/scripts/monitor/conntrack_unreplied_syn.sh 脚本文件
- name: Remove conntrack_unreplied_syn.sh script
  become: true
  file:
    path: /opt/cloudland/scripts/monitor/conntrack_unreplied_syn.sh
    state: absent
  when: script_check.stat.exists
  tags: [monitor]

# 清理旧的 conntrack-collection 系统服务和脚本后，重载 systemd 配置以确保变更生效。
- name: Reload systemd daemon after cleanup
  become: true
  systemd:
    daemon_reload: yes
  tags: [monitor]

# 创建该 exporter 的 systemd service 文件，该文件会定时执行该 exporter 的 shell 脚本。
- name: Deploy systemd service for IP block exporter
  become: true
  template:
    src: ip-block-exporter.service.j2
    dest: /etc/systemd/system/ip-block-exporter.service
    mode: '0644'
  tags: [monitor]

# 创建该 exporter 的 systemd timer 文件，该文件会定时执行该 exporter 的 systemd service 文件。
- name: Deploy systemd timer for IP block exporter
  become: true
  template:
    src: ip-block-exporter.timer.j2
    dest: /etc/systemd/system/ip-block-exporter.timer
    mode: '0644'
  tags: [monitor]

# 重新加载 systemd 配置
- name: Reload systemd for IP block exporter
  become: true
  systemd:
    daemon_reload: yes
  tags: [monitor]

# 启动该 exporter 的 systemd timer
# 执行的是这个shell /opt/cloudland/scripts/monitor/export_blocked_ips.sh
# systemctl status ip-block-exporter.timer
- name: Enable and start ip-block-exporter.timer
  become: true
  systemd:
    name: ip-block-exporter.timer
    enabled: yes
    state: started
  tags: [monitor]

# 创建该 exporter 的 systemd service 文件，该文件会定时执行该 exporter 的 shell 脚本。
- name: Deploy systemd service for packet drop exporter
  become: true
  template:
    src: packet-drop-exporter.service.j2
    dest: /etc/systemd/system/packet-drop-exporter.service
    mode: '0644'
  tags: [monitor]

# 创建该 exporter 的 systemd timer 文件，该文件会定时执行该 exporter 的 shell 脚本。
- name: Deploy systemd timer for packet drop exporter
  become: true
  template:
    src: packet-drop-exporter.timer.j2
    dest: /etc/systemd/system/packet-drop-exporter.timer
    mode: '0644'
  tags: [monitor]

# 在创建 / 修改了该 exporter 的 systemd 服务配置文件（如 /etc/systemd/system/packet-drop-exporter.service）之后，
# 通过重载 systemd 让配置生效，为后续启动 / 重启该监控服务做铺垫。
- name: Reload systemd for packet drop exporter
  become: true
  systemd:
    daemon_reload: yes
  tags: [monitor]

# systemctl status packet-drop-exporter.timer
# 执行的shell shell /opt/cloudland/scripts/monitor/export_packet_drops.sh
- name: Enable and start packet-drop-exporter.timer
  become: true
  systemd:
    name: packet-drop-exporter.timer
    enabled: yes
    state: started
  tags: [monitor]
